name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # For PRs: only run if the 'docker-build' label is present
    # For push events: always run
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docker-build'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        run: |
          echo "### Docker Image Built Successfully! 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ℹ️  **Note:** PR images are tagged as \`pr-<number>\` and won't update the \`latest\` tag." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To test this image:**" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    name: Deploy to Local Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "Client ID length: ${#TAILSCALE_OAUTH_CLIENT_ID}"
          echo "Secret length: ${#TAILSCALE_OAUTH_SECRET}"
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create deployment directory and .env file on server
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} << 'ENDSSH'
            mkdir -p ~/arc-raiders-bot
            cat > ~/arc-raiders-bot/.env << 'ENDENV'
          ENDSSH
          
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} \
            "cat >> ~/arc-raiders-bot/.env" <<< "$ENV_CONTENT"
          
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} \
            "echo 'ENDENV' >> ~/arc-raiders-bot/.env"

      - name: Copy docker-compose.yml to server
        run: |
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no \
            docker-compose.yml \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }}:~/arc-raiders-bot/

      - name: Deploy with docker-compose
        run: |
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} << 'EOF'
            cd ~/arc-raiders-bot
            echo "Pulling latest Docker image..."
            docker-compose pull --quiet
            echo "Restarting service..."
            docker-compose up -d
            echo "Deployment complete!"
          EOF

      - name: Wait for service to be ready
        run: |
          echo "Waiting for bot to become healthy..."
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} << 'EOF'
            for i in {1..12}; do
              if curl -f http://localhost:6767/health 2>/dev/null; then
                echo "✅ Bot is healthy!"
                echo "Health check response:"
                curl -s http://localhost:6767/health | jq .
                exit 0
              fi
              echo "Attempt $i/12: Waiting for health check..."
              sleep 5
            done
            echo "❌ Health check failed after 60 seconds"
            echo "Container logs:"
            cd ~/arc-raiders-bot
            docker-compose logs --tail=50
            exit 1
          EOF

      - name: Show deployment logs
        if: success()
        run: |
          echo "Fetching deployment logs..."
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} \
            "cd ~/arc-raiders-bot && docker-compose logs --tail=30"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.LOCAL_SERVER_SSH_HOST_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Path:** ~/arc-raiders-bot" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** http://localhost:6767/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The bot is now running with the latest Docker image." >> $GITHUB_STEP_SUMMARY

  notify-discord:
    name: Send Discord Notification
    needs: deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Extract tag version
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted tag: $TAG"

      - name: Fetch release data
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching release data for ${{ steps.tag.outputs.version }}..."
          
          # Fetch release data
          RELEASE_JSON=$(gh release view ${{ steps.tag.outputs.version }} \
            --repo ${{ github.repository }} \
            --json body,name,url)
          
          # Extract fields
          RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name')
          RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.url')
          RELEASE_BODY=$(echo "$RELEASE_JSON" | jq -r '.body')
          
          # Save to outputs (use base64 to handle multiline)
          echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Release data fetched successfully"

      - name: Send Discord webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Preparing Discord webhook payload..."
          
          # Get timestamp in ISO 8601 format
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          # Prepare changelog (truncate if needed)
          CHANGELOG=$(cat << 'EOF'
          ${{ steps.release.outputs.body }}
          EOF
          )
          
          # Truncate changelog if longer than 3800 chars
          MAX_LENGTH=3800
          if [ ${#CHANGELOG} -gt $MAX_LENGTH ]; then
            CHANGELOG="${CHANGELOG:0:$MAX_LENGTH}...\n\n[📖 See full changelog](${{ steps.release.outputs.url }})"
          fi
          
          # Escape JSON special characters
          CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | jq -Rs .)
          
          # Build JSON payload
          PAYLOAD=$(cat <<JSON
          {
            "embeds": [{
              "title": "🚀 ${{ steps.release.outputs.name }}",
              "description": $CHANGELOG_ESCAPED,
              "color": 3066993,
              "url": "${{ steps.release.outputs.url }}",
              "timestamp": "$TIMESTAMP",
              "footer": {
                "text": "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}"
              }
            }]
          }
          JSON
          )
          
          # Send webhook with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Sending webhook..."
            
            HTTP_CODE=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
              -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Discord webhook sent successfully (HTTP $HTTP_CODE)"
              SUCCESS=true
              break
            else
              echo "⚠️  Webhook failed with HTTP $HTTP_CODE"
              cat /tmp/webhook_response.txt
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                SLEEP_TIME=$((5 * RETRY_COUNT))
                echo "Retrying in ${SLEEP_TIME}s..."
                sleep $SLEEP_TIME
              fi
            fi
          done
          
          # Log result to step summary
          if [ "$SUCCESS" = true ]; then
            echo "### ✅ Discord Notification Sent" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release notification posted to Discord webhook." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Discord Notification Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed to send webhook after $MAX_RETRIES attempts." >> $GITHUB_STEP_SUMMARY
            echo "Last HTTP code: $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi