name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Local Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "Client ID length: ${#TAILSCALE_OAUTH_CLIENT_ID}"
          echo "Secret length: ${#TAILSCALE_OAUTH_SECRET}"
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create deployment directory and .env file on server
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} << 'ENDSSH'
            mkdir -p ~/arc-raiders-bot
            cat > ~/arc-raiders-bot/.env << 'ENDENV'
          ENDSSH
          
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} \
            "cat >> ~/arc-raiders-bot/.env" <<< "$ENV_CONTENT"
          
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} \
            "echo 'ENDENV' >> ~/arc-raiders-bot/.env"

      - name: Copy docker-compose.yml to server
        run: |
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no \
            docker-compose.yml \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }}:~/arc-raiders-bot/

      - name: Deploy with docker-compose
        run: |
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} << 'EOF'
            cd ~/arc-raiders-bot
            echo "Pulling latest Docker image..."
            docker-compose pull
            echo "Restarting service..."
            docker-compose up -d
            echo "Deployment complete!"
          EOF

      - name: Wait for service to be ready
        run: |
          echo "Waiting for bot to become healthy..."
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} << 'EOF'
            for i in {1..12}; do
              if curl -f http://localhost:6767/health 2>/dev/null; then
                echo "✅ Bot is healthy!"
                echo "Health check response:"
                curl -s http://localhost:6767/health | jq .
                exit 0
              fi
              echo "Attempt $i/12: Waiting for health check..."
              sleep 5
            done
            echo "❌ Health check failed after 60 seconds"
            echo "Container logs:"
            cd ~/arc-raiders-bot
            docker-compose logs --tail=50
            exit 1
          EOF

      - name: Show deployment logs
        if: success()
        run: |
          echo "Fetching deployment logs..."
          sshpass -p "${{ secrets.LOCAL_SERVER_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.LOCAL_SERVER_SSH_USER }}@${{ secrets.LOCAL_SERVER_SSH_HOST_IP }} \
            "cd ~/arc-raiders-bot && docker-compose logs --tail=30"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.LOCAL_SERVER_SSH_HOST_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Path:** ~/arc-raiders-bot" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** http://localhost:6767/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The bot is now running with the latest Docker image." >> $GITHUB_STEP_SUMMARY