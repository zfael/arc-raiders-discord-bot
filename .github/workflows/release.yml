name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (auto will determine from commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (do not create tag/release)'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag
        id: get_latest_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "Latest tag: $latest_tag"

      - name: Get commits since last tag
        id: commits
        run: |
          latest_tag="${{ steps.get_latest_tag.outputs.latest_tag }}"
          commits=$(git log ${latest_tag}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$commits" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Count commits
          commit_count=$(echo "$commits" | wc -l)
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          echo "Commits since $latest_tag: $commit_count"

      - name: Determine version bump
        id: version_bump
        run: |
          latest_tag="${{ steps.get_latest_tag.outputs.latest_tag }}"
          commits="${{ steps.commits.outputs.commits }}"
          manual_bump="${{ inputs.version_bump }}"
          
          # Remove 'v' prefix for version calculation
          current_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$current_version"
          
          # Determine bump type
          if [ "$manual_bump" != "auto" ]; then
            bump_type="$manual_bump"
            echo "Using manual bump type: $bump_type"
          else
            # Auto-detect from commits
            if echo "$commits" | grep -qiE "^(feat|feature)(\(.+\))?!:|BREAKING CHANGE:|breaking:"; then
              bump_type="major"
              echo "Detected BREAKING CHANGE - major bump"
            elif echo "$commits" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
              bump_type="minor"
              echo "Detected feature commits - minor bump"
            else
              bump_type="patch"
              echo "Detected fix/chore commits - patch bump"
            fi
          fi
          
          # Calculate new version
          case "$bump_type" in
            major)
              new_major=$((major + 1))
              new_version="${new_major}.0.0"
              ;;
            minor)
              new_minor=$((minor + 1))
              new_version="${major}.${new_minor}.0"
              ;;
            patch)
              new_patch=$((patch + 1))
              new_version="${major}.${minor}.${new_patch}"
              ;;
          esac
          
          echo "bump_type=$bump_type" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "new_tag=v$new_version" >> $GITHUB_OUTPUT
          echo "New version: v$new_version (${bump_type} bump)"

      - name: Generate changelog
        id: changelog
        run: |
          latest_tag="${{ steps.get_latest_tag.outputs.latest_tag }}"
          new_tag="${{ steps.version_bump.outputs.new_tag }}"
          
          # Create changelog sections
          features=""
          fixes=""
          breaking=""
          other=""
          
          # Get commits with full message
          git log ${latest_tag}..HEAD --pretty=format:"%H|||%s|||%b" | while IFS='|||' read -r hash subject body; do
            # Check for breaking changes
            if echo "$subject" | grep -qiE "^(feat|fix|refactor|chore)(\(.+\))?!:" || echo "$body" | grep -qi "BREAKING CHANGE:"; then
              breaking="${breaking}- ${subject} (${hash:0:7})\n"
            # Features
            elif echo "$subject" | grep -qiE "^feat(\(.+\))?:"; then
              features="${features}- ${subject#feat*: } (${hash:0:7})\n"
            # Fixes
            elif echo "$subject" | grep -qiE "^fix(\(.+\))?:"; then
              fixes="${fixes}- ${subject#fix*: } (${hash:0:7})\n"
            # Other
            else
              other="${other}- ${subject} (${hash:0:7})\n"
            fi
          done
          
          # Build changelog
          changelog="## What's Changed\n\n"
          
          if [ -n "$breaking" ]; then
            changelog="${changelog}### ⚠️ BREAKING CHANGES\n\n${breaking}\n"
          fi
          
          if [ -n "$features" ]; then
            changelog="${changelog}### ✨ Features\n\n${features}\n"
          fi
          
          if [ -n "$fixes" ]; then
            changelog="${changelog}### 🐛 Bug Fixes\n\n${fixes}\n"
          fi
          
          if [ -n "$other" ]; then
            changelog="${changelog}### 🔧 Other Changes\n\n${other}\n"
          fi
          
          changelog="${changelog}\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${latest_tag}...${new_tag}"
          
          # Save to file and output
          echo -e "$changelog" > RELEASE_NOTES.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display release information
        run: |
          echo "==================================="
          echo "Release Information"
          echo "==================================="
          echo "Current tag: ${{ steps.get_latest_tag.outputs.latest_tag }}"
          echo "New tag: ${{ steps.version_bump.outputs.new_tag }}"
          echo "Bump type: ${{ steps.version_bump.outputs.bump_type }}"
          echo "Commits: ${{ steps.commits.outputs.commit_count }}"
          echo "Pre-release: ${{ inputs.prerelease }}"
          echo "Dry run: ${{ inputs.dry_run }}"
          echo "==================================="
          echo ""
          cat RELEASE_NOTES.md

      - name: Create and push tag
        if: inputs.dry_run == false
        run: |
          new_tag="${{ steps.version_bump.outputs.new_tag }}"
          
          # Create annotated tag on current commit
          git tag -a "$new_tag" -m "Release $new_tag"
          
          # Push only the tag (not to main branch)
          git push origin "$new_tag"
          
          echo "Created and pushed tag: $new_tag"

      - name: Create GitHub Release
        if: inputs.dry_run == false
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_bump.outputs.new_tag }}
          release_name: Release ${{ steps.version_bump.outputs.new_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Summary
        run: |
          echo "### Release Created! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version_bump.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ steps.version_bump.outputs.bump_type }} bump" >> $GITHUB_STEP_SUMMARY
          echo "**Commits:** ${{ steps.commits.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker images will be built automatically at:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:${{ steps.version_bump.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version_bump.outputs.new_tag }})" >> $GITHUB_STEP_SUMMARY
